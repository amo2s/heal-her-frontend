[package]
name = "auth"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros"] }
uuid = { version = "1", features = ["v4", "v7", "fast-rng", "serde"] }
argon2 = "0.5"
validator = { version = "0.20", features = ["derive"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout", "limit", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
moka = { version = "0.12", features = ["future"] }
ahash = "0.8"
blake3 = "1.5"
subtle = "2.6"
pollster = "0.4"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
rand = "0.8"
base64 = "0.22"

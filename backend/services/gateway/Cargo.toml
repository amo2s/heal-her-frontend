[package]
name = "api-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
pingora = { version = "0.3", features = ["proxy", "lb"] }
pingora-core = "0.3"
pingora-proxy = "0.3"
pingora-load-balancing = "0.3"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
lazy_static = "1.4"
governor = "0.6"
dashmap = "5.5"
nonzero_ext = "0.3"
http = "1.1"

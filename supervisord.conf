[supervisord]
nodaemon=true
pidfile=/tmp/supervisor/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0

[unix_http_server]
file=/tmp/supervisor/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor/supervisor.sock

# ------------------------------------------------------------------------------
# 1. Nginx User-Space Reverse Proxy Gatekeeper (Port 7860)
# ------------------------------------------------------------------------------
[program:nginx]
command=nginx -c /app/config/nginx.conf -g 'daemon off;'
directory=/app
autostart=true
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=10

# ------------------------------------------------------------------------------
# 2. Rust Zero-Trust Authentication Microservice (Port 8080)
# ------------------------------------------------------------------------------
[program:auth]
command=/app/bin/auth
directory=/app/bin
environment=HOST="127.0.0.1",PORT="8080"
autostart=true
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=20

# ------------------------------------------------------------------------------
# 3. Rust Multi-Schema Dashboard GraphQL Microservice (Port 8081)
# ------------------------------------------------------------------------------
[program:dashboard]
command=/app/bin/dashboard
directory=/app/bin
environment=HOST="127.0.0.1",PORT="8081"
autostart=true
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=20

# ------------------------------------------------------------------------------
# 4. Python Legal Consent & Terms of Service Microservice (Port 8082)
# ------------------------------------------------------------------------------
[program:tos]
command=uvicorn app.main:app --host 127.0.0.1 --port 8082
directory=/app/legal_service
environment=HOST="127.0.0.1",PORT="8082",PYTHONPATH="/app/legal_service"
autostart=true
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=20

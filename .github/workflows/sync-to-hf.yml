name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Secret Availability
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set or empty in GitHub repository settings!"
            exit 1
          fi

      - name: Prepare Clean Backend Bundle & Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create and switch to a temporary orphan branch (purges binary git history)
          git checkout --orphan hf-deploy
          
          # Remove frontend and public directories containing images/binaries
          rm -rf frontend public
          
          # Stage and commit the clean backend state
          git add -A
          git commit -m "chore: strip frontend assets for Hugging Face backend deployment" || echo "No changes to commit"
          
          # Force push the clean branch to Hugging Face Space main branch
          git push --force https://Sliverboy:${HF_TOKEN}@huggingface.co/spaces/Sliverboy/healher-backend hf-deploy:main

worker_processes auto;
pid /tmp/nginx/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # User-space temporary buffer paths (strictly owned by UID 1000)
    client_body_temp_path /tmp/nginx/client_body 1 2;
    proxy_temp_path       /tmp/nginx/proxy 1 2;
    fastcgi_temp_path     /tmp/nginx/fastcgi 1 2;
    uwsgi_temp_path       /tmp/nginx/uwsgi 1 2;
    scgi_temp_path        /tmp/nginx/scgi 1 2;

    # Unified standard output logging for Hugging Face container telemetry
    access_log /dev/stdout combined;

    # Performance and TCP optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Dynamic Origin Whitelist mapping for CORS
    map $http_origin $cors_origin {
        default "";
        "~^https?://(healher\.vercel\.app|localhost:3000|127\.0\.0\.1:3000)$" "$http_origin";
    }

    # Internal microservice upstream clusters
    upstream auth_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    upstream dashboard_backend {
        server 127.0.0.1:8081;
        keepalive 32;
    }

    upstream tos_backend {
        server 127.0.0.1:8082;
        keepalive 32;
    }

    server {
        # Hugging Face external ingress port
        listen 7860;
        server_name _;

        # Standard perimeter proxy headers forwarded to internal services
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Perimeter Gateway Health and Liveness Probes
        location = /health {
            default_type application/json;
            return 200 '{"status":"healthy","service":"heal-her-huggingface-gateway"}';
        }

        location = /api/health {
            default_type application/json;
            return 200 '{"status":"healthy","service":"heal-her-huggingface-gateway"}';
        }

        # ----------------------------------------------------------------------
        # 1. Authentication Microservice Route Ingress (/api/v1/auth/, /login, etc.)
        # ----------------------------------------------------------------------
        location ~ ^/(api/v1/auth/|api/auth/|login|signup|refresh|logout|terminate-session) {
            # CORS Preflight OPTIONS Short-Circuit
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With, x-healher-handshake, x-healher-verified-ip' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Length' 0;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Vary' 'Origin' always;

            proxy_pass http://auth_backend;
        }

        # ----------------------------------------------------------------------
        # 2. Multi-Schema Dashboard GraphQL Microservice Ingress
        # ----------------------------------------------------------------------
        location ~ ^/(api/v1/dashboard/|kids/dashboard/|teens/dashboard/|young_adult/dashboard/) {
            # CORS Preflight OPTIONS Short-Circuit
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With, x-healher-handshake, x-healher-verified-ip' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Length' 0;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Vary' 'Origin' always;

            proxy_pass http://dashboard_backend;
        }

        # ----------------------------------------------------------------------
        # 3. Terms of Service & Legal Microservice Ingress (/api/v1/tos, /api/v1/render, /status)
        # ----------------------------------------------------------------------
        location ~ ^/(api/v1/tos|api/v1/render|status) {
            # CORS Preflight OPTIONS Short-Circuit
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With, x-healher-handshake, x-healher-verified-ip' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Length' 0;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Vary' 'Origin' always;

            proxy_pass http://tos_backend;
        }

        # Fallback 404 handler for unmatched routes
        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With, x-healher-handshake, x-healher-verified-ip' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Length' 0;
                return 204;
            }

            default_type application/json;
            return 404 '{"error":"Not Found","message":"Unmatched gateway route on Hugging Face ingress"}';
        }
    }
}
